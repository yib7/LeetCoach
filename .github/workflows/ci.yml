name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows is the developed/tested platform (see README); the suite mocks the
    # `claude` subprocess, so CI needs no real CLI and makes no Claude calls.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Windows launcher script syntax check (A1/C14)
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path . -Recurse -Filter *.ps1 | ForEach-Object {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              Write-Error "$($_.FullName): $($parseErrors -join '; ')"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Test (pytest)
        run: python -m pytest -q
