# Tooling config only — LeetCoach is run from source (app.py), not pip-installed,
# so there is no [project]/[build-system] table here.

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Ruff 0.16's default rule set plus import sorting (I) and the pycodestyle
# E4/E7/E9 groups the pre-0.16 default carried (0.16 keeps only E722/E902), so
# moving to 0.16 adds checks without silently dropping any the baseline had.
extend-select = ["I", "E4", "E7", "E9"]
